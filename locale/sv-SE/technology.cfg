[technology-description]
cube-bulk-inserters=Lastkranar som kan flytta flera föremål av samma typ samtidigt.
cube-fluid-handling=Olika sätt att förvara och transportera vätskor.
cube-electric-energy-distribution=Flexiblare sätt att distribuera el.
cube-automobilism=Motordrivet fordon som används för transport.
cube-railway=Storskaliga transporter över långa avstånd.
cube-stone-wall=Murar som skyddar din fabrik mot angripare.
cube-gate=Mursektioner som öppnas upp vid behov. Kan styras av kretsnätverket.
cube-concrete=Avancerat byggmaterial som även kan användas som golv.
cube-landfill=Kan placeras på vatten för att skapa mark du kan bygga på.
cube-battery=Elektrokemisk cell som lagrar och ger energi till elektriska apparater.
cube-explosives=Utvecklar farliga men kontrollerbara sprängämnen.
cube-cliff-explosives=Tunnor med tillräckliga sprängämnen för att demolera klippor.
cube-robotics=Chassin för flygande robotar. Måste specialiseras för logistik- eller konstruktionsuppgifter.
cube-construction-robotics=Konstruktionsrobotar kan reparera och bygga vänliga enheter. Du kan också beordra robotar att bygga nya byggnader genom att placera ett spöke där.
cube-night-vision-equipment=Infogas i rustning så att du kan se bättre på natten.
cube-belt-immunity-equipment=Infogas i rustning för att hindra transportband från att flytta dig.
cube-toolbelt=Utökar ditt förråd.
cube-electric-energy-accumulators=Byggnader som lagrar överskottsel för senare användning.
cube-personal-roboport-equipment=Sätts in i rustningen så att konstruktionsrobotar kan arbeta från ditt förråd.
cube-personal-roboport-mk2-equipment=Sätts in i rustningen så att konstruktionsrobotar kan arbeta från ditt förråd.
cube-battery-mk2-equipment=Infogas i rustningar för att spara mycket energi till senare.
cube-exoskeleton-equipment=Infogas i rustning för att öka rörelsehastigheten. Du kan utrusta dig med flera exoskelett på en gång.
cube-exoskeleton-equipment-mk2=Infogas i rustning för att öka rörelsehastigheten. Du kan utrusta dig med flera exoskelett på en gång.

cube-efficiency-module=Minskar maskinens energiförbrukning. Minsta energiförbrukning är 20%.

cube-braking-force=Tågen kan sakta ner snabbare, vilket ger dem möjlighet att köra på högre hastigheter en längre tid.
cube-worker-robot-speed=Ökar flyghastigheten för logistik- och konstruktionsrobotar.
cube-worker-robot-storage=Ökar antalet föremål som logistik- och konstruktionsrobotar kan bära samtidigt.
cube-research-speed=Låser upp effektivare forskningspraxis.
cube-toolbelt-extension=Utökar ditt förråd.




